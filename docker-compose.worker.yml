# Optional extract worker: keeps Coolify/web thin (HTTP + poll only).
# Web and worker share DATABASE_URL / secrets. Flip WORKER_ENABLED=true on BOTH
# only when this service is running — otherwise jobs stay pending forever.
#
# On VPS (same image as Coolify app):
#   export RECIAPP_IMAGE=$(docker inspect -f '{{.Config.Image}}' <coolify-app-cid>)
#   docker compose -f docker-compose.worker.yml up -d

services:
  reciapp-worker:
    image: ${RECIAPP_IMAGE:?set RECIAPP_IMAGE to the Coolify backend image}
    container_name: reciapp-worker
    restart: unless-stopped
    # The shared image healthcheck probes the API's HTTP port; the worker has
    # no HTTP server. API /ready validates the durable worker heartbeat.
    healthcheck:
      disable: true
    command: ["python", "-m", "app.worker"]
    env_file:
      - ${RECIAPP_ENV_FILE:-/etc/reciapp/recipe-backend.env}
    environment:
      WORKER_ENABLED: "true"
      # Worker does the heavy path; keep slots aligned with web.
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      HF_HOME: /tmp/hf
      HUGGINGFACE_HUB_CACHE: /tmp/hf
      COVER_STORAGE_DIR: /var/lib/reciapp/covers
    volumes:
      - /var/lib/reciapp/covers:/var/lib/reciapp/covers:rw
    networks:
      - reciapp-internal
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  reciapp-internal:
    external: true
